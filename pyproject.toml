[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bebibem-forecast"
version = "0.1.0"
description = "Previsão de demanda da loja própria BebiBem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-stubs~=3.0.5",
    "scikit-learn>=1.5",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
bebibem-forecast = "bebibem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bebibem"]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "nbmake>=1.5",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
