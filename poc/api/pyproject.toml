[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poc-api"
version = "0.1.0"
description = "API do POC de planejamento de demanda (consome o pacote bebibem)"
requires-python = ">=3.11"
dependencies = [
    "bebibem-forecast",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
bebibem-forecast = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/poc_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.6",
]
